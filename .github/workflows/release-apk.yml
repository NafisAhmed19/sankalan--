name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (খালি রাখলে অটো version.json অনুযায়ী v1.0 নেবে)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          "$SDK_MGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDK_MGR" --install "platforms;android-36.1" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Prepare keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64"
            base64 -di debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 not found in repo — generating a temporary keystore whose SHA-1 will differ from Firebase!"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare Firebase config (optional secret fallback)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            echo "Found root google-services.json, copying to app/google-services.json"
            cp google-services.json app/google-services.json
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repo. Commit app/google-services.json or set GOOGLE_SERVICES_JSON secret so Firebase Sign-In works in the built APK."
          elif ! grep -q "com.aistudio.sankalant.vknrzt" app/google-services.json; then
            echo "::warning::app/google-services.json does NOT contain package_name com.aistudio.sankalant.vknrzt — replace it with the current app/google-services.json from AI Studio!"
          else
            echo "Verified app/google-services.json matches com.aistudio.sankalant.vknrzt"
          fi

      - name: Build APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: gradle :app:assembleDebug --no-daemon --no-build-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"

      - name: Package APK & version.json
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sankalan-t.apk
          VER_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | awk '{print $3}' | tr -d '\r')
          VER_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          cat > dist/version.json <<EOF
          {
            "versionCode": ${VER_CODE},
            "versionName": "${VER_NAME}",
            "changelogEn": "New release of Sankalan-t v${VER_NAME}.",
            "changelogBn": "সংকলন-ৎ v${VER_NAME} রিলিজ হয়েছে।",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/sankalan-t.apk"
          }
          EOF
          echo "VER_NAME=${VER_NAME}" >> "$GITHUB_ENV"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          CLEAN_TAG=$(echo "${INPUT_TAG}" | xargs)
          TAG="${CLEAN_TAG:-v${VER_NAME}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/sankalan-t.apk dist/version.json --clobber
          else
            gh release create "$TAG" dist/sankalan-t.apk dist/version.json --title "সংকলন-ৎ | Sankalan-t $TAG" --notes "Official release of Sankalan-t."
          fi
