name: Build Sankalan APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK licenses & ensure SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null 2>&1 || true
          "$SDK_MGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDK_MGR" --install "platforms;android-36.1" || true

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -di debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Firebase config (optional secret fallback)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -f google-services.json ]; then
            echo "Found root google-services.json, copying to app/google-services.json"
            cp google-services.json app/google-services.json
          fi
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repo. Commit app/google-services.json or set GOOGLE_SERVICES_JSON secret so Firebase Sign-In works in the built APK."
          elif ! grep -q "com.aistudio.sankalant.vknrzt" app/google-services.json; then
            echo "::warning::app/google-services.json does NOT contain package_name com.aistudio.sankalant.vknrzt — replace it with the current app/google-services.json from AI Studio!"
          else
            echo "Verified app/google-services.json matches com.aistudio.sankalant.vknrzt"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: gradle :app:assembleDebug --no-daemon --no-build-cache --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sankalan-t-debug-apk
          path: app/build/outputs/apk/debug/*.apk
